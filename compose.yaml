services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: productcompare_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - catalog_data:/var/lib/postgresql
volumes:
  catalog_data:

